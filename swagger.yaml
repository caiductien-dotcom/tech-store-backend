openapi: 3.0.0

info:
  title: Tech Store API
  description: API documentation for Tech Store Ecommerce Backend.
  version: '0.1'

servers:
  - url: https://tech-store-backend-37qq.onrender.com
    description: Production Render Server
  - url: http://localhost:5000
    description: Local Express Server

tags:
  - name: Authentication
    description: User registration, login, and profile APIs
  - name: Category
    description: Product category management APIs
  - name: Product
    description: Product management APIs
  - name: Cart
    description: Shopping cart management APIs
  - name: Order
    description: Order checkout and management APIs (Cart-driven & Role-based)
  - name: Shipping
    description: Shipping calculation and carrier management APIs
  - name: Payment
    description: Online payment integration APIs (VNPay Sandbox)
  - name: Review
    description: Product review and rating APIs with verified purchase validation
  - name: Admin - Dashboard
    description: Dashboard analytics, overview statistics, top-selling products, and revenue charts (Admin only)



paths:
  /api/auth/guest:
    post:
      tags:
        - Authentication
      summary: Initialize a guest session
      description: Issues a JWT token for anonymous visitors to track analytics and temporary cart sessions.
      operationId: createGuestSession
      responses:
        '200':
          description: Guest session created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestResponse"
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Create a new user account.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        '201':
          description: Register successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        '400':
          description: Missing required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '409':
          description: Email already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Login
      description: Authenticate user and return JWT token.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        '200':
          description: Login successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        '400':
          description: Email and password are required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/me:
    get:
      tags:
        - Authentication
      summary: Get current logged-in user profile
      description: Retrieve profile information of the currently authenticated user (or guest) using JWT Token.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetMeResponse"
        '401':
          description: Unauthorized - Token missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/categories:
    get:
      tags:
        - Category
      summary: Get all product categories
      description: Retrieve a list of all available categories (Requires Guest/Customer/Admin token for tracking).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Categories fetched successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"
        '401':
          description: Unauthorized - Token missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags:
        - Category
      summary: Create a new category
      description: Create a product category (Requires Admin role).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryRequest"
      responses:
        '201':
          description: Category created successfully.
        '400':
          description: Bad request - Missing or duplicate category name.
        '401':
          description: Unauthorized - Missing or invalid token.
        '403':
          description: Forbidden - Action allowed for Admins only.

  /api/categories/{id}:
    get:
      tags:
        - Category
      summary: Get category by ID
      description: Retrieve details of a specific category.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Category retrieved successfully.
        '401':
          description: Unauthorized - Missing or invalid token.
        '404':
          description: Category not found.

    put:
      tags:
        - Category
      summary: Update a category
      description: Update an existing category (Requires Admin role).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryRequest"
      responses:
        '200':
          description: Category updated successfully.
        '401':
          description: Unauthorized - Missing or invalid token.
        '403':
          description: Forbidden - Admin role required.

    delete:
      tags:
        - Category
      summary: Delete a category
      description: Delete a category by ID (Requires Admin role).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Category deleted successfully.
        '401':
          description: Unauthorized - Missing or invalid token.
        '403':
          description: Forbidden - Admin role required.

  /api/products:
    get:
      tags:
        - Product
      summary: Get all products
      description: Retrieve a paginated list of active products. Supports search by name and filter by category (Public access).
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of items per page
        - in: query
          name: search
          schema:
            type: string
          description: Search products by name (case-insensitive)
        - in: query
          name: category_id
          schema:
            type: integer
          description: Filter products by category ID
      responses:
        "200":
          description: Products fetched successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                        example: 50
                      page:
                        type: integer
                        example: 1
                      limit:
                        type: integer
                        example: 10
                      totalPages:
                        type: integer
                        example: 5
        "500":
          description: Internal server error.

    post:
      tags:
        - Product
      summary: Create a new product
      description: Create a new product. seller_id is automatically taken from the JWT token (Requires Admin role).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequest"
      responses:
        "201":
          description: Product created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Product created successfully!
                  data:
                    $ref: "#/components/schemas/Product"
        "400":
          description: Bad request - Missing required fields.
        "401":
          description: Unauthorized - Missing or invalid token.
        "403":
          description: Forbidden - Action allowed for Admins only.

  /api/products/{id}:
    get:
      tags:
        - Product
      summary: Get product by ID
      description: Retrieve details of a specific product including category, seller info, and variants.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: Product retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/ProductDetail"
        "404":
          description: Product not found.

    put:
      tags:
        - Product
      summary: Update a product
      description: Update an existing product (Requires Admin role). Only provided fields will be updated.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequest"
      responses:
        "200":
          description: Product updated successfully.
        "403":
          description: Forbidden - Admin role required.
        "404":
          description: Product not found.

    delete:
      tags:
        - Product
      summary: Delete a product
      description: Delete a product by ID (Requires Admin role).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: Product deleted successfully.
        "403":
          description: Forbidden - Admin role required.
        "404":
          description: Product not found.

  /api/cart:
    get:
      tags:
        - Cart
      summary: Get shopping cart
      description: Retrieve all items in the customer's cart with summary.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Cart retrieved successfully.
        '401':
          description: Unauthorized.

    delete:
      tags:
        - Cart
      summary: Clear entire cart
      description: Removes all items from the current customer's cart.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Cart cleared successfully.

  /api/cart/items:
    post:
      tags:
        - Cart
      summary: Add item to cart
      description: Add a product variant to the cart. Sets is_selected to true automatically.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - variant_id
              properties:
                variant_id:
                  type: integer
                  example: 1
                quantity:
                  type: integer
                  example: 1
                  default: 1
      responses:
        '200':
          description: Item added to cart successfully.
        '400':
          description: Bad request or out of stock.

  /api/cart/items/{id}:
    put:
      tags:
        - Cart
      summary: Update cart item
      description: Update quantity or is_selected status of an item.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer
                  example: 2
                is_selected:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Cart item updated successfully.

    delete:
      tags:
        - Cart
      summary: Remove single item from cart
      description: Delete a specific item by cart_item_id.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Item removed successfully.
          
  /api/orders:
    post:
      tags:
        - Order
      summary: Create order from cart
      description: Automatically checkout all items in cart with is_selected = true. Validates stock, deducts inventory, creates payment record and clears ordered items from cart (Requires Customer role).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderFromCartRequest"
      responses:
        "201":
          description: Order placed successfully from cart.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Order placed successfully from cart!
                  data:
                    $ref: "#/components/schemas/Order"
        "400":
          description: Bad request - Missing info, empty cart, or insufficient stock.
        "401":
          description: Unauthorized - Token missing or invalid.
        "403":
          description: Forbidden - Customer role required.
        "500":
          description: Internal server error.

    get:
      tags:
        - Order
      summary: Get all orders
      description: Retrieve a paginated list of all customer orders in the system (Requires Admin role).
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of items per page
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, confirmed, shipping, delivered, cancelled]
          description: Filter by order status
        - in: query
          name: user_id
          schema:
            type: integer
          description: Filter by specific customer user_id
      responses:
        "200":
          description: Orders retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                        example: 25
                      page:
                        type: integer
                        example: 1
                      limit:
                        type: integer
                        example: 10
                      totalPages:
                        type: integer
                        example: 3
        "401":
          description: Unauthorized.
        "403":
          description: Forbidden - Admin role required.

  /api/orders/my-orders:
    get:
      tags:
        - Order
      summary: Get my orders
      description: Retrieve a paginated list of orders placed by the current logged-in customer (Requires Customer role).
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, confirmed, shipping, delivered, cancelled]
      responses:
        "200":
          description: Customer orders retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                        example: 5
                      page:
                        type: integer
                        example: 1
                      limit:
                        type: integer
                        example: 10
                      totalPages:
                        type: integer
                        example: 1
        "401":
          description: Unauthorized.
        "403":
          description: Forbidden - Customer role required.

  /api/orders/{id}:
    get:
      tags:
        - Order
      summary: Get order details by ID
      description: Retrieve details of an order including items, product info, and payment records. Customers can only view their own orders; Admins can view any order.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: Order details retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Order"
        "401":
          description: Unauthorized.
        "403":
          description: Forbidden - Cannot access other users' orders.
        "404":
          description: Order not found.

    delete:
      tags:
        - Order
      summary: Delete order
      description: Permanently delete an order and associated items (Requires Admin role).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: Order deleted successfully.
        "401":
          description: Unauthorized.
        "403":
          description: Forbidden - Admin role required.
        "404":
          description: Order not found.

  /api/orders/{id}/cancel:
    put:
      tags:
        - Order
      summary: Cancel own order
      description: Cancel an order if it is still in 'pending' status. Automatically restores variant stock and cancels associated payment (Requires Customer role).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: Order cancelled successfully and stock restored.
        "400":
          description: Bad request - Order is not in pending status.
        "401":
          description: Unauthorized.
        "403":
          description: Forbidden - Cannot cancel another customer's order.
        "404":
          description: Order not found.

  /api/orders/{id}/status:
    put:
      tags:
        - Order
      summary: Update order status
      description: Transition order status (pending -> confirmed -> shipping -> delivered / cancelled). If updated to cancelled, inventory is automatically restored. If updated to delivered with COD, payment is marked as completed (Requires Admin role).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusRequest"
      responses:
        "200":
          description: Order status updated successfully.
        "400":
          description: Bad request - Invalid status.
        "401":
          description: Unauthorized.
        "403":
          description: Forbidden - Admin role required.
        "404":
          description: Order not found.
  /api/shipping/calculate:
    post:
      tags:
        - Shipping
      summary: Calculate shipping fees and methods
      description: Returns available shipping methods, estimated delivery time, and shipping fees based on customer province and order total.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - province
              properties:
                province:
                  type: string
                  example: "Hà Nội"
                total_amount:
                  type: number
                  example: 5500000
      responses:
        '200':
          description: Shipping fee calculated successfully.
        '400':
          description: Missing province.

  /api/shipping/carriers:
    get:
      tags:
        - Shipping
      summary: Get supported shipping carriers
      description: Returns list of integrated couriers (GHTK, GHN, Viettel Post, etc.).
      responses:
        '200':
          description: Carriers retrieved successfully.
  
  /api/payments/create-vnpay-url:
    post:
      tags:
        - Payment
      summary: Generate VNPay Sandbox payment URL
      description: Creates a secure payment URL to redirect the customer to VNPay gateway.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - order_id
              properties:
                order_id:
                  type: integer
                  example: 1
                bank_code:
                  type: string
                  example: NCB
                  description: Optional bank code (e.g. NCB, VNPAYQR, VISA)
      responses:
        '200':
          description: Payment URL generated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: VNPay payment URL created successfully!
                  payment_url:
                    type: string
                    example: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html?...
        '400':
          description: Missing order_id or invalid request.
        '404':
          description: Order not found.

  /api/payments/vnpay-return:
    get:
      tags:
        - Payment
      summary: VNPay Return URL callback
      description: Handles the redirect callback from VNPay after customer completes or cancels payment. Automatically updates order and payment status.
      parameters:
        - in: query
          name: vnp_ResponseCode
          schema:
            type: string
          description: Response code from VNPay ('00' means success)
        - in: query
          name: vnp_SecureHash
          schema:
            type: string
          description: Checksum hash from VNPay
      responses:
        '200':
          description: Payment verified and order confirmed successfully.
        '400':
          description: Payment failed, cancelled or invalid signature.

  /api/reviews:
    post:
      tags:
        - Review
      summary: Submit a product review (Delivered order required)
      description: Allows a customer who has purchased and received a product (order status is delivered) to submit a 1-5 star review with comment and optional images. Automatically recalculates product rating_avg and review_count (Requires Customer role).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewRequest"
      responses:
        '201':
          description: Review submitted successfully and product rating recalculated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Review submitted successfully and product rating recalculated!
                  data:
                    $ref: "#/components/schemas/Review"
                  product_stats:
                    type: object
                    properties:
                      product_id:
                        type: integer
                        example: 1
                      rating_avg:
                        type: number
                        example: 4.8
                      review_count:
                        type: integer
                        example: 12
        '400':
          description: Bad request - Invalid rating, item not delivered, or already reviewed.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden - Customer role required.
        '404':
          description: Order item or product not found.

  /api/reviews/product/{productId}:
    get:
      tags:
        - Review
      summary: Get reviews for a specific product
      description: Retrieve a paginated list of reviews for a product, including user info, images, star breakdown, and product rating statistics (Public access).
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: integer
          example: 1
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Items per page
        - in: query
          name: rating
          schema:
            type: integer
            minimum: 1
            maximum: 5
          description: Filter by star rating (1 to 5)
        - in: query
          name: sort
          schema:
            type: string
            enum: [newest, highest, lowest, oldest]
            default: newest
          description: Sort reviews
      responses:
        '200':
          description: Reviews retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductReviewListResponse"
        '404':
          description: Product not found.

  /api/products/{id}/reviews:
    get:
      tags:
        - Product
        - Review
      summary: Get reviews of product (Sub-resource)
      description: Alternative endpoint to get reviews for a product directly under /api/products/:id/reviews (Public access).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: rating
          schema:
            type: integer
        - in: query
          name: sort
          schema:
            type: string
            enum: [newest, highest, lowest, oldest]
      responses:
        '200':
          description: Reviews retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductReviewListResponse"
        '404':
          description: Product not found.

  /api/reviews/my-reviews:
    get:
      tags:
        - Review
      summary: Get reviews written by logged-in customer
      description: Retrieve all reviews posted by the current customer (Requires Customer role).
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Reviews retrieved successfully.
        '401':
          description: Unauthorized.

  /api/reviews/{id}:
    delete:
      tags:
        - Review
      summary: Delete a review
      description: Delete a review (Author or Admin). Automatically recalculates the product's rating_avg and review_count.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Review deleted successfully and rating recalculated.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden - Not the review author or admin.
        '404':
          description: Review not found.

  /api/admin/dashboard/stats:
    get:
      tags:
        - Admin - Dashboard
      summary: Get overview dashboard statistics (Admin only)
      description: Returns total revenue from delivered orders, total orders, pending orders breakdown, user count, and inventory health (Requires Admin role).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Dashboard statistics retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStatsResponse'
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden - Admin role required.

  /api/admin/dashboard/top-products:
    get:
      tags:
        - Admin - Dashboard
      summary: Get top-selling products by sold_count (Admin only)
      description: Returns top 5, 10 or N best-selling products sorted by sold_count (Requires Admin role).
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            example: 5
          description: Number of top products to return (e.g. 5 or 10)
      responses:
        '200':
          description: Top selling products retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopSellingProductsResponse'
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden - Admin role required.

  /api/admin/dashboard/revenue-chart:
    get:
      tags:
        - Admin - Dashboard
      summary: Get revenue chart data by month or week (Admin only)
      description: Returns chart data formatted for frontend visualization (by 12 months of the year or by last 7 days) (Requires Admin role).
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: period
          schema:
            type: string
            enum: [month, week]
            default: month
          description: Time period grouping (month or week)
        - in: query
          name: year
          schema:
            type: integer
            example: 2026
          description: Year for monthly revenue chart (default current year)
      responses:
        '200':
          description: Revenue chart data retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueChartResponse'
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden - Admin role required.

components:


  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: Nguyen Van A
        email:
          type: string
          format: email
          example: abc@gmail.com
        password:
          type: string
          format: password
          example: 123456

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: abc@gmail.com
        password:
          type: string
          format: password
          example: 123456

    RegisterUser:
      type: object
      description: Registered user information.
      required:
        - id
        - name
        - email
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Nguyen Van A
        email:
          type: string
          format: email
          example: abc@gmail.com

    User:
      type: object
      description: User information.
      required:
        - id
        - name
        - role
      properties:
        id:
          type: string
          example: "1"
        name:
          type: string
          example: Nguyen Van A
        email:
          type: string
          format: email
          example: abc@gmail.com
        role:
          type: string
          example: CUSTOMER

    Category:
      type: object
      properties:
        category_id:
          type: integer
          example: 1
        name:
          type: string
          example: Laptop
        description:
          type: string
          example: High performance gaming laptops

    CategoryRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Laptop
        description:
          type: string
          example: High performance gaming laptops

    GuestResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Guest session created successfully
        data:
          type: object
          properties:
            token:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            guestId:
              type: string
              example: guest_8b05658e-0cf0-4cfa-9311-57ff0e3d2ba3
            role:
              type: string
              example: GUEST

    Product:
      type: object
      properties:
        product_id:
          type: integer
          example: 1
        seller_id:
          type: integer
          example: 1
        category_id:
          type: integer
          example: 1
        name:
          type: string
          example: iPhone 15 Pro Max
        description:
          type: string
          example: Latest Apple smartphone with A17 Pro chip
        image_url:
          type: string
          example: https://example.com/iphone15.jpg
        brand:
          type: string
          example: Apple
        price:
          type: number
          format: decimal
          example: 29990000.00
        discount_percent:
          type: integer
          example: 10
        warranty_months:
          type: integer
          example: 12
        sold_count:
          type: integer
          example: 150
        rating_avg:
          type: number
          example: 4.5
        review_count:
          type: integer
          example: 30
        low_stock_threshold:
          type: integer
          example: 5
        status:
          type: string
          example: active
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        category:
          $ref: "#/components/schemas/Category"
        seller:
          type: object
          properties:
            user_id:
              type: integer
              example: 1
            name:
              type: string
              example: Nguyen Van A
            email:
              type: string
              example: admin@gmail.com

    ProductDetail:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          properties:
            variants:
              type: array
              items:
                $ref: "#/components/schemas/ProductVariant"

    ProductVariant:
      type: object
      properties:
        variant_id:
          type: integer
          example: 1
        product_id:
          type: integer
          example: 1
        sku:
          type: string
          example: IPH15PM-256-BLK
        color:
          type: string
          example: Black
        size:
          type: string
          example: 256GB
        price:
          type: number
          format: decimal
          example: 29990000.00
        stock:
          type: integer
          example: 50

    ProductRequest:
      type: object
      required:
        - name
        - price
        - category_id
      properties:
        name:
          type: string
          example: iPhone 15 Pro Max
        description:
          type: string
          example: Latest Apple smartphone with A17 Pro chip
        image_url:
          type: string
          example: https://example.com/iphone15.jpg
        brand:
          type: string
          example: Apple
        price:
          type: number
          example: 29990000.00
        discount_percent:
          type: integer
          example: 10
        warranty_months:
          type: integer
          example: 12
        low_stock_threshold:
          type: integer
          example: 5
        category_id:
          type: integer
          example: 1
        status:
          type: string
          example: active
          enum:
            - active
            - inactive

    RegisterResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Register successfully
        data:
          $ref: "#/components/schemas/RegisterUser"

    LoginResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Login successfully
        data:
          type: object
          properties:
            token:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            user:
              $ref: "#/components/schemas/User"

    GetMeResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/User"

    ErrorResponse:
      type: object
      description: Standard error response format.
      required:
        - success
        - message
        - errorCode
        - timestamp
        - path
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Invalid email or password
        errorCode:
          type: string
          example: AUTH_004
        timestamp:
          type: string
          format: date-time
          example: "2026-08-15T10:30:00Z"
        path:
          type: string
          example: /api/auth/login

    CreateOrderFromCartRequest:
      type: object
      required:
        - receiver_name
        - receiver_phone
        - shipping_address
      properties:
        receiver_name:
          type: string
          example: Nguyen Van A
        receiver_phone:
          type: string
          example: "0901234567"
        shipping_address:
          type: string
          example: 123 Nguyen Hue, Quan 1, TP.HCM
        shipping_method:
          type: string
          example: standard
          default: standard
        shipping_fee:
          type: number
          example: 30000
          default: 0
        discount_amount:
          type: number
          example: 0
          default: 0
        payment_method:
          type: string
          example: COD
          enum: [COD, VNPAY, MOMO]
          default: COD
        note:
          type: string
          example: Giao gio hanh chinh

    UpdateOrderStatusRequest:
      type: object
      required:
        - status
