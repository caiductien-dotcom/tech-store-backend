openapi: 3.0.0

info:
  title: Tech Store API
  description: API documentation for Tech Store Ecommerce Backend.
  version: '0.1'

servers:
  - url: https://tech-store-backend-37qq.onrender.com
    description: Production Render Server
  - url: http://localhost:5000
    description: Local Express Server

tags:
  - name: Authentication
    description: User registration, login, and profile APIs
  - name: Category
    description: Product category management APIs
  - name: Product
    description: Product management APIs
  - name: Order
    description: Order checkout and management APIs (Cart-driven & Role-based)

paths:
  /api/auth/guest:
    post:
      tags:
        - Authentication
      summary: Initialize a guest session
      description: Issues a JWT token for anonymous visitors to track analytics and temporary cart sessions.
      operationId: createGuestSession
      responses:
        '200':
          description: Guest session created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestResponse"
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Create a new user account.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        '201':
          description: Register successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        '400':
          description: Missing required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '409':
          description: Email already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Login
      description: Authenticate user and return JWT token.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        '200':
          description: Login successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        '400':
          description: Email and password are required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '401':
          description: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/me:
    get:
      tags:
        - Authentication
      summary: Get current logged-in user profile
      description: Retrieve profile information of the currently authenticated user (or guest) using JWT Token.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetMeResponse"
        '401':
          description: Unauthorized - Token missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/categories:
    get:
      tags:
        - Category
      summary: Get all product categories
      description: Retrieve a list of all available categories (Requires Guest/Customer/Admin token for tracking).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Categories fetched successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"
        '401':
          description: Unauthorized - Token missing or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags:
        - Category
      summary: Create a new category
      description: Create a product category (Requires Admin role).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryRequest"
      responses:
        '201':
          description: Category created successfully.
        '400':
          description: Bad request - Missing or duplicate category name.
        '401':
          description: Unauthorized - Missing or invalid token.
        '403':
          description: Forbidden - Action allowed for Admins only.

  /api/categories/{id}:
    get:
      tags:
        - Category
      summary: Get category by ID
      description: Retrieve details of a specific category.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Category retrieved successfully.
        '401':
          description: Unauthorized - Missing or invalid token.
        '404':
          description: Category not found.

    put:
      tags:
        - Category
      summary: Update a category
      description: Update an existing category (Requires Admin role).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryRequest"
      responses:
        '200':
          description: Category updated successfully.
        '401':
          description: Unauthorized - Missing or invalid token.
        '403':
          description: Forbidden - Admin role required.

    delete:
      tags:
        - Category
      summary: Delete a category
      description: Delete a category by ID (Requires Admin role).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Category deleted successfully.
        '401':
          description: Unauthorized - Missing or invalid token.
        '403':
          description: Forbidden - Admin role required.

  /api/products:
    get:
      tags:
        - Product
      summary: Get all products
      description: Retrieve a paginated list of active products. Supports search by name and filter by category (Public access).
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of items per page
        - in: query
          name: search
          schema:
            type: string
          description: Search products by name (case-insensitive)
        - in: query
          name: category_id
          schema:
            type: integer
          description: Filter products by category ID
      responses:
        "200":
          description: Products fetched successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                        example: 50
                      page:
                        type: integer
                        example: 1
                      limit:
                        type: integer
                        example: 10
                      totalPages:
                        type: integer
                        example: 5
        "500":
          description: Internal server error.

    post:
      tags:
        - Product
      summary: Create a new product
      description: Create a new product. seller_id is automatically taken from the JWT token (Requires Admin role).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequest"
      responses:
        "201":
          description: Product created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Product created successfully!
                  data:
                    $ref: "#/components/schemas/Product"
        "400":
          description: Bad request - Missing required fields.
        "401":
          description: Unauthorized - Missing or invalid token.
        "403":
          description: Forbidden - Action allowed for Admins only.

  /api/products/{id}:
    get:
      tags:
        - Product
      summary: Get product by ID
      description: Retrieve details of a specific product including category, seller info, and variants.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: Product retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/ProductDetail"
        "404":
          description: Product not found.

    put:
      tags:
        - Product
      summary: Update a product
      description: Update an existing product (Requires Admin role). Only provided fields will be updated.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequest"
      responses:
        "200":
          description: Product updated successfully.
        "403":
          description: Forbidden - Admin role required.
        "404":
          description: Product not found.

    delete:
      tags:
        - Product
      summary: Delete a product
      description: Delete a product by ID (Requires Admin role).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: Product deleted successfully.
        "403":
          description: Forbidden - Admin role required.
        "404":
          description: Product not found.

  /api/orders:
    post:
      tags:
        - Order
      summary: Create order from cart (Checkout)
      description: Automatically checkout all items in cart with is_selected = true. Validates stock, deducts inventory, creates payment record and clears ordered items from cart (Requires Customer role).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderFromCartRequest"
      responses:
        "201":
          description: Order placed successfully from cart.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Order placed successfully from cart!
                  data:
                    $ref: "#/components/schemas/Order"
        "400":
          description: Bad request - Missing info, empty cart, or insufficient stock.
        "401":
          description: Unauthorized - Token missing or invalid.
        "403":
          description: Forbidden - Customer role required.
        "500":
          description: Internal server error.

    get:
      tags:
        - Order
      summary: Get all orders (Admin)
      description: Retrieve a paginated list of all customer orders in the system (Requires Admin role).
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of items per page
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, confirmed, shipping, delivered, cancelled]
          description: Filter by order status
        - in: query
          name: user_id
          schema:
            type: integer
          description: Filter by specific customer user_id
      responses:
        "200":
          description: Orders retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                        example: 25
                      page:
                        type: integer
                        example: 1
                      limit:
                        type: integer
                        example: 10
                      totalPages:
                        type: integer
                        example: 3
        "401":
          description: Unauthorized.
        "403":
          description: Forbidden - Admin role required.

  /api/orders/my-orders:
    get:
      tags:
        - Order
      summary: Get my orders (Customer)
      description: Retrieve a paginated list of orders placed by the current logged-in customer (Requires Customer role).
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, confirmed, shipping, delivered, cancelled]
      responses:
        "200":
          description: Customer orders retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                        example: 5
                      page:
                        type: integer
                        example: 1
                      limit:
                        type: integer
                        example: 10
                      totalPages:
                        type: integer
                        example: 1
        "401":
          description: Unauthorized.
        "403":
          description: Forbidden - Customer role required.

  /api/orders/{id}:
    get:
      tags:
        - Order
      summary: Get order details by ID
      description: Retrieve details of an order including items, product info, and payment records. Customers can only view their own orders; Admins can view any order.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: Order details retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Order"
        "401":
          description: Unauthorized.
        "403":
          description: Forbidden - Cannot access other users' orders.
        "404":
          description: Order not found.

    delete:
      tags:
        - Order
      summary: Delete order (Admin)
      description: Permanently delete an order and associated items (Requires Admin role).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: Order deleted successfully.
        "401":
          description: Unauthorized.
        "403":
          description: Forbidden - Admin role required.
        "404":
          description: Order not found.

  /api/orders/{id}/cancel:
    put:
      tags:
        - Order
      summary: Cancel own order (Customer)
      description: Cancel an order if it is still in 'pending' status. Automatically restores variant stock and cancels associated payment (Requires Customer role).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: Order cancelled successfully and stock restored.
        "400":
          description: Bad request - Order is not in pending status.
        "401":
          description: Unauthorized.
        "403":
          description: Forbidden - Cannot cancel another customer's order.
        "404":
          description: Order not found.

  /api/orders/{id}/status:
    put:
      tags:
        - Order
      summary: Update order status (Admin)
      description: Transition order status (pending -> confirmed -> shipping -> delivered / cancelled). If updated to cancelled, inventory is automatically restored. If updated to delivered with COD, payment is marked as completed (Requires Admin role).
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusRequest"
      responses:
        "200":
          description: Order status updated successfully.
        "400":
          description: Bad request - Invalid status.
        "401":
          description: Unauthorized.
        "403":
          description: Forbidden - Admin role required.
        "404":
          description: Order not found.


components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: Nguyen Van A
        email:
          type: string
          format: email
          example: abc@gmail.com
        password:
          type: string
          format: password
          example: 123456

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: abc@gmail.com
        password:
          type: string
          format: password
          example: 123456

    RegisterUser:
      type: object
      description: Registered user information.
      required:
        - id
        - name
        - email
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Nguyen Van A
        email:
          type: string
          format: email
          example: abc@gmail.com

    User:
      type: object
      description: User information.
      required:
        - id
        - name
        - role
      properties:
        id:
          type: string
          example: "1"
        name:
          type: string
          example: Nguyen Van A
        email:
          type: string
          format: email
          example: abc@gmail.com
        role:
          type: string
          example: CUSTOMER

    Category:
      type: object
      properties:
        category_id:
          type: integer
          example: 1
        name:
          type: string
          example: Laptop
        description:
          type: string
          example: High performance gaming laptops

    CategoryRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Laptop
        description:
          type: string
          example: High performance gaming laptops

    GuestResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Guest session created successfully
        data:
          type: object
          properties:
            token:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            guestId:
              type: string
              example: guest_8b05658e-0cf0-4cfa-9311-57ff0e3d2ba3
            role:
              type: string
              example: GUEST

    Product:
      type: object
      properties:
        product_id:
          type: integer
          example: 1
        seller_id:
          type: integer
          example: 1
        category_id:
          type: integer
          example: 1
        name:
          type: string
          example: iPhone 15 Pro Max
        description:
          type: string
          example: Latest Apple smartphone with A17 Pro chip
        image_url:
          type: string
          example: https://example.com/iphone15.jpg
        brand:
          type: string
          example: Apple
        price:
          type: number
          format: decimal
          example: 29990000.00
        discount_percent:
          type: integer
          example: 10
        warranty_months:
          type: integer
          example: 12
        sold_count:
          type: integer
          example: 150
        rating_avg:
          type: number
          example: 4.5
        review_count:
          type: integer
          example: 30
        low_stock_threshold:
          type: integer
          example: 5
        status:
          type: string
          example: active
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        category:
          $ref: "#/components/schemas/Category"
        seller:
          type: object
          properties:
            user_id:
              type: integer
              example: 1
            name:
              type: string
              example: Nguyen Van A
            email:
              type: string
              example: admin@gmail.com

    ProductDetail:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          properties:
            variants:
              type: array
              items:
                $ref: "#/components/schemas/ProductVariant"

    ProductVariant:
      type: object
      properties:
        variant_id:
          type: integer
          example: 1
        product_id:
          type: integer
          example: 1
        sku:
          type: string
          example: IPH15PM-256-BLK
        color:
          type: string
          example: Black
        size:
          type: string
          example: 256GB
        price:
          type: number
          format: decimal
          example: 29990000.00
        stock:
          type: integer
          example: 50

    ProductRequest:
      type: object
      required:
        - name
        - price
        - category_id
      properties:
        name:
          type: string
          example: iPhone 15 Pro Max
        description:
          type: string
          example: Latest Apple smartphone with A17 Pro chip
        image_url:
          type: string
          example: https://example.com/iphone15.jpg
        brand:
          type: string
          example: Apple
        price:
          type: number
          example: 29990000.00
        discount_percent:
          type: integer
          example: 10
        warranty_months:
          type: integer
          example: 12
        low_stock_threshold:
          type: integer
          example: 5
        category_id:
          type: integer
          example: 1
        status:
          type: string
          example: active
          enum:
            - active
            - inactive

    RegisterResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Register successfully
        data:
          $ref: "#/components/schemas/RegisterUser"

    LoginResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Login successfully
        data:
          type: object
          properties:
            token:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            user:
              $ref: "#/components/schemas/User"

    GetMeResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/User"

    ErrorResponse:
      type: object
      description: Standard error response format.
      required:
        - success
        - message
        - errorCode
        - timestamp
        - path
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Invalid email or password
        errorCode:
          type: string
          example: AUTH_004
        timestamp:
          type: string
          format: date-time
          example: "2026-08-15T10:30:00Z"
        path:
          type: string
          example: /api/auth/login

    CreateOrderFromCartRequest:
      type: object
      required:
        - receiver_name
        - receiver_phone
        - shipping_address
      properties:
        receiver_name:
          type: string
          example: Nguyen Van A
        receiver_phone:
          type: string
          example: "0901234567"
        shipping_address:
          type: string
          example: 123 Nguyen Hue, Quan 1, TP.HCM
        shipping_method:
          type: string
          example: standard
          default: standard
        shipping_fee:
          type: number
          example: 30000
          default: 0
        discount_amount:
          type: number
          example: 0
          default: 0
        payment_method:
          type: string
          example: COD
          enum: [COD, VNPAY, MOMO]
          default: COD
        note:
          type: string
          example: Giao gio hanh chinh

    UpdateOrderStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [pending, confirmed, shipping, delivered, cancelled]
          example: confirmed

    Order:
      type: object
      properties:
        order_id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 2
        receiver_name:
          type: string
          example: Nguyen Van A
        receiver_phone:
          type: string
          example: "0901234567"
        shipping_address:
          type: string
          example: 123 Nguyen Hue, Quan 1, TP.HCM
        shipping_method:
          type: string
          example: standard
        shipping_fee:
          type: number
          format: decimal
          example: 30000.00
        discount_amount:
          type: number
          format: decimal
          example: 0.00
        total_amount:
          type: number
          format: decimal
          example: 29990000.00
        payment_method:
          type: string
          example: COD
        status:
          type: string
          example: pending
        created_at:
          type: string
          format: date-time
        order_items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        payments:
          type: array
          items:
            $ref: "#/components/schemas/Payment"

    OrderItem:
      type: object
      properties:
        order_item_id:
          type: integer
          example: 1
        order_id:
          type: integer
          example: 1
        variant_id:
          type: integer
          example: 1
        quantity:
          type: integer
          example: 1
        unit_price:
          type: number
          format: decimal
          example: 29990000.00
        variant:
          $ref: "#/components/schemas/ProductVariant"

    Payment:
      type: object
      properties:
        payment_id:
          type: integer
          example: 1
        order_id:
          type: integer
          example: 1
        method:
          type: string
          example: COD
        vnp_txn_ref:
          type: string
          nullable: true
          example: null
        amount:
          type: number
          format: decimal
          example: 29990000.00
        status:
          type: string
          example: pending
        paid_at:
          type: string
          format: date-time
          nullable: true