          type: integer
          example: 1
        user_id:
          type: integer
          example: 2
        receiver_name:
          type: string
          example: Nguyen Van A
        receiver_phone:
          type: string
          example: "0901234567"
        shipping_address:
          type: string
          example: 123 Nguyen Hue, Quan 1, TP.HCM
        shipping_method:
          type: string
          example: standard
        shipping_fee:
          type: number
          format: decimal
          example: 30000.00
        discount_amount:
          type: number
          format: decimal
          example: 0.00
        total_amount:
          type: number
          format: decimal
          example: 29990000.00
        payment_method:
          type: string
          example: COD
        status:
          type: string
          example: pending
        created_at:
          type: string
          format: date-time
